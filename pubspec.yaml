name: propsure
description: Nigeria's Most Trusted Property Rental Platform
publish_to: 'none'
version: 1.0.3+4   # ← Updated version code to 4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.15.9
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.19
  firebase_remote_config: ^4.4.2

  # State
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.0.0

  # UI
  google_fonts: ^6.3.2
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2      # ← Uses Android Photo Picker (no permissions needed)
  flutter_image_compress: ^2.2.0
  smooth_page_indicator: ^1.2.0+3
  flutter_rating_bar: ^4.0.1
  pinput: ^5.0.0
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  timeago: ^3.6.1
  intl: ^0.19.0
  uuid: ^4.3.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  logger: ^2.2.0
  infinite_scroll_pagination: ^4.0.0
  path_provider: ^2.1.3
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.6.0

  # Paystack
  webview_flutter: ^4.7.0
  http: ^1.2.1
  crypto: ^3.0.3

  # CSV / bulk upload
  csv: ^6.0.0
  file_picker: ^8.0.3

  # Security
  flutter_secure_storage: ^9.0.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  geoflutterfire_plus: ^0.0.21
  flutter_launcher_icons: ^0.14.4
  geoflutterfire2: ^2.3.15

  # REMOVED: permission_handler - no longer needed for photo/video picker
  # If you use permission_handler elsewhere, keep it, otherwise remove:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_logo.png"
  web:
    generate: true
    image_path: "assets/icon/app_logo.png"
    background_color: "#ffffff"
    theme_color: "#0175C2"